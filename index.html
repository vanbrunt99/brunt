<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Brunt">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Brunt</title>
<style>
/* Brunt · estilos. Tema oscuro, fuente del sistema, materiales translúcidos solo en barras y hojas.
   Tamaños en rem: el iPhone escala todo con su tamaño de texto (Dynamic Type). */

:root {
  color-scheme: dark;
  --bg: #000;
  --bg-1: #1c1c1e;          /* tarjetas y grupos */
  --bg-2: #2c2c2e;          /* campos y controles dentro de tarjetas */
  --bg-3: #3a3a3c;
  --fill: rgba(120, 120, 128, .24);
  --fill-2: rgba(120, 120, 128, .16);
  --sep: rgba(84, 84, 88, .6);
  --label: #fff;
  --label-2: rgba(235, 235, 245, .62);
  --label-3: rgba(235, 235, 245, .32);
  --accent: #0a84ff;
  --accent-press: #0060c8;
  --green: #30d158;
  --orange: #ff9f0a;
  --red: #ff453a;
  --yellow: #ffd60a;
  --purple: #bf5af2;
  --teal: #64d2ff;
  --gold: #e8c46a;
  /* macros: un color fijo por macro en toda la app */
  --mk: #30d158;
  --mp: #64d2ff;
  --mc: #ffd60a;
  --mg: #ff9f0a;
  --radius: 1rem;
  --radius-s: .65rem;
  --bar-h: 3.05rem;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --material: rgba(28, 28, 30, .72);
  --material-heavy: rgba(20, 20, 22, .86);
  --blur: saturate(180%) blur(20px);
}
html.pad-b { --safe-b: 34px; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font: -apple-system-body; background: var(--bg); }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: -apple-system, system-ui, "SF Pro Text", "Helvetica Neue", sans-serif;
  font-size: 1rem; line-height: 1.35; letter-spacing: -.01em;
  color: var(--label); background: var(--bg);
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font-size: max(1rem, 16px); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: .4rem; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--label-2); }
.dim3 { color: var(--label-3); }
.hide { display: none !important; }

/* ── Tipografía ── tracking según tamaño: negativo en títulos grandes, casi 0 en el cuerpo */
.t-large { font-size: 2rem; line-height: 1.12; font-weight: 700; letter-spacing: -.022em; }
.t-title { font-size: 1.32rem; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.t-head { font-size: 1rem; font-weight: 600; letter-spacing: -.015em; }
.t-sub { font-size: .88rem; letter-spacing: -.005em; }
.t-foot { font-size: .77rem; letter-spacing: 0; }
.t-cap { font-size: .7rem; letter-spacing: .01em; }
.t-hero { font-size: 2.7rem; line-height: 1; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }

/* ── Estructura ── */
#app { min-height: 100vh; }
.view { padding: calc(var(--safe-t) + .7rem) 1rem calc(var(--bar-h) + var(--safe-b) + 6.5rem); max-width: 40rem; margin: 0 auto; }
.lt { display: flex; align-items: flex-end; justify-content: space-between; gap: .75rem; margin: .35rem .1rem .9rem; min-height: 2.6rem; }
.lt .sub { display: block; font-size: .88rem; color: var(--label-2); font-weight: 500; letter-spacing: -.005em; margin-bottom: .1rem; }
.lt-act { display: flex; gap: .4rem; padding-bottom: .2rem; }

/* barra superior compacta: aparece al desplazar, con material y borde difuminado en vez de línea */
.topbar {
  position: fixed; inset: 0 0 auto 0; z-index: 40;
  padding: calc(var(--safe-t) + .55rem) 1rem .55rem; text-align: center;
  font-weight: 600; font-size: 1rem; letter-spacing: -.015em;
  background: var(--material); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  opacity: 0; pointer-events: none; transition: opacity .18s ease;
}
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; background: linear-gradient(rgba(0,0,0,.35), transparent); pointer-events: none; }
.topbar.on { opacity: 1; }

/* barra de pestañas: material translúcido, el contenido pasa por debajo */
.tabbar {
  position: fixed; inset: auto 0 0 0; z-index: 50;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: .3rem .4rem calc(var(--safe-b) + .2rem);
  background: var(--material-heavy); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border-top: .5px solid rgba(255,255,255,.08);
}
.tab { display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .25rem 0 .15rem; color: var(--label-3); font-size: .63rem; font-weight: 600; letter-spacing: .01em; min-height: 2.75rem; }
.tab svg { width: 1.55rem; height: 1.55rem; transition: transform .1s ease-out; }
.tab:active svg { transform: scale(.88); }
.tab[aria-current="page"] { color: var(--accent); }

/* ── Tarjetas y grupos (estilo lista agrupada de iOS) ── */
.card { background: var(--bg-1); border-radius: var(--radius); padding: 1rem; margin-bottom: .75rem; }
.card.tap { display: block; width: 100%; text-align: left; transition: transform .1s ease-out, background-color .1s ease-out; }
.card.tap:active, .card.tap.pressed { transform: scale(.985); background: #232325; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin-bottom: .55rem; }
.card-h .t-head { display: flex; align-items: center; gap: .4rem; }
.card-h .more { color: var(--label-3); font-size: .88rem; display: flex; align-items: center; gap: .2rem; }
.sec { margin: 1.4rem .2rem .45rem; font-size: .77rem; font-weight: 600; color: var(--label-2); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; align-items: center; }
.sec button { text-transform: none; letter-spacing: -.005em; font-size: .88rem; color: var(--accent); font-weight: 500; }
.group { background: var(--bg-1); border-radius: var(--radius); overflow: hidden; margin-bottom: .75rem; }
.row {
  position: relative; display: flex; align-items: center; gap: .75rem; width: 100%;
  min-height: 2.75rem; padding: .62rem 1rem; text-align: left; background: var(--bg-1);
}
.group > .row + .row::before, .group > .swipe + .swipe::before, .group > .swipe + .row::before, .group > .row + .swipe::before {
  content: ""; position: absolute; top: 0; left: 1rem; right: 0; height: .5px; background: var(--sep); z-index: 1;
}
button.row:active, .row.tap:active, .row.pressed { background: var(--bg-2); }
.row .main { flex: 1; min-width: 0; }
.row .ttl { overflow-wrap: anywhere; }
.row .sub { font-size: .8rem; color: var(--label-2); margin-top: .08rem; overflow-wrap: anywhere; }
.row .val { color: var(--label-2); text-align: right; flex: none; }
.row .chev { color: var(--label-3); flex: none; width: 1.05rem; height: 1.05rem; margin-right: -.3rem; }
.row .ico { width: 1.85rem; height: 1.85rem; border-radius: .45rem; display: grid; place-items: center; flex: none; }
.row .ico svg { width: 1.1rem; height: 1.1rem; }
.empty { text-align: center; color: var(--label-2); padding: 1.4rem 1rem; }
.empty b { display: block; color: var(--label); font-size: 1.05rem; margin-bottom: .25rem; }

/* ── Botones: la respuesta aparece al tocar (pointerdown), no al soltar ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 2.75rem; padding: .6rem 1.1rem; border-radius: .85rem;
  background: var(--fill); color: var(--label); font-weight: 600; letter-spacing: -.01em;
  transition: transform .1s ease-out, opacity .1s ease-out, background-color .1s ease-out;
}
.btn:active, .btn.pressed { transform: scale(.97); opacity: .8; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:active, .btn.primary.pressed { background: var(--accent-press); opacity: 1; }
.btn.danger { color: var(--red); }
.btn.block { display: flex; width: 100%; }
.btn.small { min-height: 2.2rem; padding: .35rem .8rem; border-radius: .7rem; font-size: .9rem; }
.btn.plain { background: none; color: var(--accent); padding-left: .3rem; padding-right: .3rem; }
.btn:disabled { opacity: .35; pointer-events: none; }
.btn svg { width: 1.1rem; height: 1.1rem; }
.icon-btn { width: 2.25rem; height: 2.25rem; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--accent); transition: transform .1s ease-out; }
.icon-btn:active, .icon-btn.pressed { transform: scale(.9); }
.icon-btn svg { width: 1.15rem; height: 1.15rem; }
.btn-row { display: flex; gap: .6rem; }
.btn-row > .btn { flex: 1; }

/* ── Campos ── */
.field { display: block; margin-bottom: .8rem; }
.field > span { display: block; font-size: .8rem; color: var(--label-2); margin: 0 .2rem .3rem; }
.input, select.input, textarea.input {
  display: block; width: 100%; min-height: 2.75rem; padding: .6rem .85rem;
  background: var(--bg-2); border: 1px solid transparent; border-radius: .7rem; color: var(--label);
  -webkit-appearance: none; appearance: none;
}
.input:focus { border-color: var(--accent); }
textarea.input { min-height: 9rem; resize: vertical; line-height: 1.4; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: max(.88rem, 16px); }
.input::placeholder { color: var(--label-3); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
.seg { display: flex; background: var(--fill-2); border-radius: .6rem; padding: .15rem; gap: .15rem; margin-bottom: .8rem; }
.seg button { flex: 1; min-height: 2.1rem; border-radius: .48rem; font-size: .88rem; font-weight: 600; color: var(--label-2); transition: background-color .15s ease; }
.seg button[aria-pressed="true"] { background: var(--bg-3); color: var(--label); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .8rem; }
.chip { min-height: 2.1rem; padding: .3rem .8rem; border-radius: 1.05rem; background: var(--fill-2); color: var(--label-2); font-size: .88rem; font-weight: 600; transition: transform .1s ease-out; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
.switch { position: relative; width: 3.1rem; height: 1.9rem; border-radius: 1rem; background: var(--fill); flex: none; transition: background-color .2s ease; }
.switch::after { content: ""; position: absolute; top: .12rem; left: .12rem; width: 1.66rem; height: 1.66rem; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: transform .25s cubic-bezier(.3,.7,.4,1); }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(1.2rem); }
.stepper { display: flex; align-items: center; gap: .4rem; }
.stepper .input { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.stepper button { width: 2.75rem; height: 2.75rem; flex: none; border-radius: .7rem; background: var(--bg-2); font-size: 1.3rem; font-weight: 500; color: var(--accent); transition: transform .1s ease-out; }
.stepper button:active { transform: scale(.92); }

/* ── Macros ── */
.mac-hero { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.mac-hero .lbl { color: var(--label-2); font-weight: 600; font-size: .95rem; }
.mac-bars { display: grid; gap: .7rem; margin-top: .9rem; }
.mbar .top { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; font-size: .88rem; margin-bottom: .3rem; }
.mbar .name { font-weight: 600; display: flex; align-items: center; gap: .4rem; }
.mbar .name i { width: .55rem; height: .55rem; border-radius: 50%; display: inline-block; }
.mbar .state { color: var(--label-2); font-variant-numeric: tabular-nums; text-align: right; }
.mbar .state b { color: var(--label); font-weight: 600; }
.mbar .state .ok { color: var(--green); font-weight: 600; }
.mbar .state .over { color: var(--orange); font-weight: 600; }
.track { position: relative; height: .5rem; border-radius: .25rem; background: var(--fill-2); overflow: hidden; }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: .25rem; transform-origin: left center; }
.track .plan { position: absolute; inset: 0 auto 0 0; border-radius: .25rem; opacity: .28; }
.mac-src { margin-top: .85rem; display: flex; justify-content: space-between; align-items: center; gap: .6rem; font-size: .8rem; color: var(--label-2); }
.mac-src button { color: var(--accent); font-weight: 600; font-size: .85rem; }
.mini-mac { display: flex; gap: .7rem; font-size: .78rem; color: var(--label-2); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.mini-mac i { font-style: normal; font-weight: 600; }

/* ── Comidas del día ── */
.meal { margin-bottom: .75rem; }
.meal-h { display: flex; align-items: center; justify-content: space-between; padding: .25rem .2rem .45rem; gap: .5rem; }
.meal-h .t-head { font-size: 1.05rem; }
.meal-h .mk { color: var(--label-2); font-size: .8rem; font-variant-numeric: tabular-nums; }
.check { width: 1.7rem; height: 1.7rem; border-radius: 50%; border: 2px solid var(--label-3); flex: none; display: grid; place-items: center; transition: transform .12s ease-out, background-color .15s ease, border-color .15s ease; }
.check svg { width: 1rem; height: 1rem; color: #000; opacity: 0; transform: scale(.5); transition: opacity .15s ease, transform .2s cubic-bezier(.3,1.4,.5,1); }
.check.on { background: var(--green); border-color: var(--green); }
.check.on svg { opacity: 1; transform: scale(1); }
.check:active { transform: scale(.88); }
.row.eaten .ttl { color: var(--label-2); }
.tag { display: inline-block; font-size: .66rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: .12rem .4rem; border-radius: .35rem; background: var(--fill-2); color: var(--label-2); vertical-align: .1em; }
.tag.blue { background: rgba(10,132,255,.2); color: #69b4ff; }
.tag.gold { background: rgba(232,196,106,.18); color: var(--gold); }

/* ── Deslizar para eliminar: la fila sigue al dedo 1:1 ── */
.swipe { position: relative; overflow: hidden; touch-action: pan-y; }
.swipe > .row { will-change: transform; z-index: 1; }
.swipe .del { position: absolute; inset: 0 0 0 auto; width: 100%; background: var(--red); color: #fff; font-weight: 600; display: flex; align-items: center; justify-content: flex-end; padding-right: 1.2rem; }

/* ── Hojas que suben desde abajo ── */
.scrim { position: fixed; inset: 0; background: #000; opacity: 0; z-index: 90; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; max-width: 40rem; margin: 0 auto;
  height: calc(100% - var(--safe-t) - 2.4rem); display: flex; flex-direction: column;
  background: var(--bg-1); border-radius: 1.15rem 1.15rem 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.5);
  transform: translateY(110%); will-change: transform; touch-action: none;
}
.sheet.auto { height: auto; max-height: calc(100% - var(--safe-t) - 2.4rem); }
.sheet .grab { padding: .45rem 0 .1rem; display: grid; place-items: center; flex: none; }
.sheet .grab i { width: 2.3rem; height: .3rem; border-radius: .15rem; background: var(--bg-3); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .25rem 1rem .6rem; flex: none; }
.sheet-h .t-head { font-size: 1.05rem; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-h .side { width: 5.5rem; display: flex; }
.sheet-h .side.r { justify-content: flex-end; }
.sheet-h .side button { color: var(--accent); font-weight: 500; min-height: 2.4rem; padding: 0 .2rem; }
.sheet-h .side button.b { font-weight: 600; }
.sheet-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: .2rem 1rem calc(var(--safe-b) + 1.2rem); touch-action: pan-y; }
.sheet-body .card, .sheet-body .group { background: var(--bg-2); }
.sheet-body .row { background: var(--bg-2); }
.sheet-body button.row:active { background: var(--bg-3); }
.sheet-body .input, .sheet-body .stepper button { background: var(--bg-3); }
.sheet-foot { flex: none; padding: .6rem 1rem calc(var(--safe-b) + .7rem); border-top: .5px solid var(--sep); background: var(--bg-1); }

/* ── Avisos con deshacer ── */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--bar-h) + var(--safe-b) + .9rem); z-index: 200;
  display: flex; align-items: center; gap: .9rem; max-width: calc(100% - 2rem);
  padding: .7rem .9rem .7rem 1.1rem; border-radius: 1rem;
  background: rgba(44,44,46,.94); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: 0 8px 30px rgba(0,0,0,.45); font-size: .92rem; font-weight: 500;
  transform: translate(-50%, 1rem) scale(.96); opacity: 0; transition: transform .28s cubic-bezier(.2,.9,.3,1), opacity .2s ease;
}
.toast.on { transform: translate(-50%, 0) scale(1); opacity: 1; }
.toast button { color: var(--accent); font-weight: 600; white-space: nowrap; }
.toast.err { background: rgba(80,24,22,.96); }

/* estado de guardado */
.saved { position: fixed; top: calc(var(--safe-t) + .55rem); right: .8rem; z-index: 60; font-size: .72rem; font-weight: 600; color: var(--label-2); padding: .25rem .55rem; border-radius: .7rem; background: var(--material); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); opacity: 0; transition: opacity .3s ease; pointer-events: none; }
.saved.on { opacity: 1; }
.saved.err { color: #fff; background: var(--red); opacity: 1; pointer-events: auto; }
.banner { border-radius: var(--radius); padding: .85rem 1rem; margin-bottom: .75rem; background: rgba(255,159,10,.14); color: #ffd28a; font-size: .9rem; }
.banner.red { background: rgba(255,69,58,.16); color: #ffb3ad; }
.banner.blue { background: rgba(10,132,255,.15); color: #a8d1ff; }
.banner b { color: #fff; }

/* ── Entreno ── */
.rtn-meta { font-size: .82rem; color: var(--label-2); margin-top: .15rem; }
.vol { display: grid; gap: .55rem; }
.vol-row { display: grid; grid-template-columns: 6.2rem 1fr 3.4rem; align-items: center; gap: .6rem; font-size: .84rem; }
.vol-row .n { color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vol-row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--label-2); }
.vol-row .v b { color: var(--label); }
.legend { display: flex; flex-wrap: wrap; gap: .35rem .8rem; margin-top: .8rem; font-size: .72rem; color: var(--label-2); }
.legend i { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-right: .3rem; vertical-align: -.02em; }

.ex { background: var(--bg-2); border-radius: var(--radius); padding: .85rem .85rem .6rem; margin-bottom: .7rem; }
.ex-h { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
.ex-h .t-head { font-size: 1.02rem; }
.ex-h .mus { font-size: .78rem; color: var(--label-2); margin-top: .1rem; }
.last { margin: .6rem 0 .4rem; padding: .5rem .65rem; border-radius: .6rem; background: rgba(255,255,255,.05); font-size: .8rem; color: var(--label-2); font-variant-numeric: tabular-nums; }
.last b { color: var(--label); font-weight: 600; }
.last .dr { color: var(--gold); }
.tech { font-size: .8rem; color: var(--label-2); margin: .2rem 0 .4rem; }
.sets { display: grid; gap: .35rem; margin-top: .4rem; }
.set { display: grid; grid-template-columns: 1.6rem 1fr 1fr 2.75rem; gap: .45rem; align-items: center; }
.set .n { color: var(--label-3); font-size: .85rem; text-align: center; font-variant-numeric: tabular-nums; }
.set .input { text-align: center; min-height: 2.75rem; padding: .4rem; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--bg-3); }
.set .done { width: 2.75rem; height: 2.75rem; border-radius: .7rem; background: var(--bg-3); display: grid; place-items: center; color: var(--label-3); transition: transform .1s ease-out, background-color .15s ease, color .15s ease; }
.set .done svg { width: 1.2rem; height: 1.2rem; }
.set .done:active { transform: scale(.9); }
.set.ok .done { background: var(--green); color: #000; }
.set.ok .input { background: rgba(48,209,88,.12); }
.set.drop { grid-template-columns: 1.6rem 1fr 1fr 2.75rem; }
.set.drop .n { color: var(--gold); }

 {id:'tren',n:'Trembolona',aka:['Tren','Trenbolona','Finaplix','Parabolan'],cat:'trembolona',cls:'AAS 19-nor (derivado de nandrolona) de uso veterinario',via:'Inyectable intramuscular en aceite',

  inter:['Con clenbuterol, estimulantes o T3: sobrecarga cardíaca.','Con nandrolona: suma prolactina.','La cabergolina se describe como ancilar para la prolactina (ver Post ciclo).'],legal:_LEG_VET,wada:_W_S1},

  rondas:['Eliminatoria (solo si hay más de 15 atletas): 4 poses en grupos: doble bíceps de frente, pecho de lado, doble bíceps de espaldas y vacuum.','Ronda 1 (prejuzgamiento): las 4 poses en grupos de hasta 10 y comparaciones con las 7 poses obligatorias. No se hace si hay 7 atletas o menos.','Final · Ronda 2: las 7 poses en orden y luego en orden inverso (esto es lo que se puntúa), y posedown de 30–60 s que no se puntúa. Los 6 finalistas arrancan en cero.','Final · Ronda 3: rutina libre individual de máximo 60 s con tu música. Se puntúa 50 % físico y 50 % rutina.'],
  vestimenta:['Shorts de gimnasia opacos, de un solo color (cualquier color), con lados de mínimo 15 cm de alto.','Deben cubrir todo el glúteo y toda la zona frontal; los muslos quedan visibles.','Sin adornos ni relleno. Te presentas al registro con el mismo traje del prejuzgamiento y el juez principal lo aprueba; en la final puedes usar otro que cumpla lo mismo.','El número va en el lado izquierdo del traje.','Solo anillo de matrimonio: nada de calzado, lentes, reloj, aretes, pelucas, joyas ni "ayudas" a la figura. Gorra solo por motivo religioso, pequeña y aprobada en el registro.','Implantes o inyecciones de líquido que cambien la forma del músculo: prohibidos y motivo de descalificación.'],

  rutina:['Máximo 60 s, música propia: una canción por USB, lleva dos copias rotuladas con tu nombre y país. Lenguaje vulgar u ofensivo: se corta la música, sales de tarima y la ronda vale cero.','Debe incluir las poses obligatorias y poses intermedias que muestren tu desarrollo; se valora que sea fluida, artística y coreografiada.','Prohibidos: "moon pose", tirar del traje para mostrar el interior del muslo o el glúteo, acrobacias (no puedes saltar ni despegar ambos pies sin otro apoyo en el piso) y props.'],
  errores:['No dar el peso en el pesaje: sin tope no hay categoría.','Hacer el vacuum contrayendo el recto abdominal o soltarlo antes de tiempo.','Most Muscular en la pose a elección: está prohibida.','Bronceado que se despinta con la prueba de frotado.','Pose de espaldas floja: es la que más músculos evalúa.'],
  tips:['Ensaya las 7 poses en secuencia, en orden y en orden inverso, aguantando cada una 10–15 s como en la final.','Vacuum todos los días en ayunas desde ya; en tarima se pide en la eliminatoria y en cada comparación.','Haz una prueba de bronceado profesional semanas antes y pásale la prueba del frotado en casa.','Si vas justo en peso, planea el pesaje: la carga fuerte de carbohidratos va después de la báscula.']},

 {t:'Edad y elegibilidad',items:['Con 27 años compites como Senior (abierto): junior es hasta el año en que cumples 23 y masters desde los 40. "Novatos" se define por experiencia, no por edad.','En eventos internacionales IFBB necesitas la tarjeta internacional IFBB vigente, pasaporte o identificación y ser nominado por tu federación nacional; nadie se inscribe por su cuenta.','Crossovers permitidos por el reglamento general: Games Classic, Fisicoculturismo Clásico, Classic Physique y Fisicoculturismo entre sí; Men\'s Physique con Men\'s Fitness y Fit Model.','Una categoría se abre con mínimo 3 atletas (5 en mundiales y continentales); si no, se combinan. Juniors y masters nunca se combinan.']},
 {t:'Registro y pesaje',items:['El registro oficial lo controla el juez principal y normalmente es el día anterior al prejuzgamiento (en el San José Internacional 2025: 9 a.m. a 1 p.m. en el Estadio Nacional, con reunión técnica a las 5 p.m.).','Báscula calibrada en kilos con precisión de 0.1 kg y estatura medida al milímetro, empezando por la categoría más baja.','Te presentas con el mismo traje que usarás en las comparaciones del prejuzgamiento, para que lo aprueben.','Si te pasas del peso tienes máximo 30 minutos para volver a pesarte; nadie te va a buscar ni avisar. Quien llega tarde o falta al registro puede quedar fuera.','Música: una canción por USB, dos copias rotuladas con nombre y país; si compites en dos clases, una memoria por clase. Recógela al terminar.']},
 {t:'Bronceado, aceite y presentación',items:['Prueba del frotado: si el color se quita al pasar la mano, no subes. Usa autobronceador o aerógrafo profesional aplicado por personal calificado y pruébalo semanas antes.','Prohibidos brillos, glitter, perlas metálicas y dorados; aceite y humectante con moderación, nunca excesivo.','Sin calzado, lentes, reloj, aretes, pelucas ni joyas (solo anillo de matrimonio). Gorra solo por motivo religioso y aprobada en el registro.','Nada de goma de mascar, otros productos ni beber líquidos en tarima; props prohibidos.','Implantes o inyecciones de líquido que cambien la forma de un músculo: prohibidos y motivo de descalificación.','Cámaras y video prohibidos tras bambalinas y en vestidores (solo prensa autorizada).']},
 {t:'Conducta y sanciones',items:['Salir de la tarima antes de que termine la premiación puede descalificarte.','Retirarse sin permiso: suspensión de hasta un año y multa de hasta €1 000 a la federación.','Música con lenguaje vulgar u ofensivo: se detiene, sales de tarima y la ronda vale cero.','En Men\'s Physique: tarjeta amarilla = advertencia; roja = un puesto abajo por tarjeta.']},
 {t:'Cómo se puntúa',items:['Cada juez da una colocación individual sin empates. Con 9 jueces se descartan las 2 más altas y las 2 más bajas (con menos jueces, 1 y 1) y se suman las demás: gana la suma más baja. Empates por el método de Relative Placement.','Del prejuzgamiento pasan 6 a la final y arrancan en cero: lo del prejuzgamiento no cuenta en la final; los jueces deben evaluarte "fresco", porque la condición cambia entre la mañana y la noche.','Eliminatoria (si hay más de 15): cada juez marca sus 15 mejores con una X; el juez principal puede cambiar a 10 o 17.','El overall de cada división lo disputan los ganadores de clase.']},
 {t:'Antidopaje',items:['La IFBB es signataria del Código Mundial Antidopaje; el San José Internacional 2025 se anunció sujeto a las reglas de la WADA con controles administrados por CONAD (Comisión Nacional Antidopaje de Costa Rica), y la AFFCR declara cumplir el código de la WADA en todos sus eventos.','Controles en competencia: selección aleatoria en el pesaje, selección entre finalistas y controles dirigidos. Fuera de competencia: grupo registrado de atletas (top de mundiales).','Un resultado adverso de la muestra A puede traer suspensión provisional inmediata; las sanciones siguen las reglas antidopaje IFBB (primera infracción típicamente de hasta 4 años según la sustancia).','Prohibidos en todo momento (dentro y fuera de competencia): S0 sustancias no aprobadas, S1 agentes anabólicos (todos los esteroides, clenbuterol, SARMs), S2 hormonas peptídicas y factores de crecimiento (GH, péptidos GHRP/GHRH, IGF-1, hCG en hombres), S3 beta-2 agonistas, S4 moduladores hormonales y metabólicos (inhibidores de aromatasa, clomifeno, tamoxifeno, cardarine, SR9009, insulina), S5 diuréticos y agentes enmascarantes.','Prohibidos solo en competencia (desde las 23:59 del día anterior hasta terminar la recolección de muestras): estimulantes, narcóticos, cannabinoides y glucocorticoides.','Casi todo lo de tu biblioteca farmacológica está en la lista de prohibiciones; cada ficha dice su estatus antidopaje (revísalo antes de usar algo). Si usas un medicamento con receta, el camino es la exención por uso terapéutico (TUE) antes del evento.','En Costa Rica la Ley General de Salud 5395 prohíbe importar, vender y usar medicamentos sin registro sanitario; los anabólicos registrados se venden solo con receta.']},
 {t:'Lista para la semana del show',items:['Traje aprobado (y uno de repuesto), número con alfileres a la izquierda, board shorts si haces crossover.','Dos USB con tu canción rotulados, identificación, tarjeta o carné de la asociación, comprobante de inscripción.','Cita de bronceado profesional (dos capas: noche anterior y mañana del show) y ropa oscura holgada para no mancharla.','Comida de tarima en recipientes, sal, agua, ligas para el pump, toalla, chanclas, rasuradora.','Hora de registro, reunión técnica y orden de categorías confirmados con la AFFCR.']}

 sch:{name:'Pecho de lado',en:'Side chest',
   oficial:'Puedes elegir el lado para mostrar tu mejor brazo. El brazo cercano a los jueces se dobla en ángulo recto con el puño cerrado y la otra mano sujeta esa muñeca. La pierna cercana se dobla por la rodilla y se apoya en la punta del pie.',
   tecnica:['Pierna de delante doblada y en punta con el gemelo apretado; la de atrás firme.','Cadera hacia atrás y lejos de los jueces, pecho arriba y expandido: inhala, sube las costillas y mantén.','Con la mano lejana tira de la muñeca cercana: eso contrae bíceps y pectoral sin esfuerzo visible.','Hombro lejano un poco más alto que el cercano para dar profundidad al pecho.','Isquiotibiales contraídos (se juzgan en esta pose). Mira a los jueces.'],
   jueces:'Pectorales, arco de la caja torácica, bíceps, isquiotibiales y gemelos, con muslo y gemelo vistos de perfil.',
   errores:['No expandir el pecho (la pose pierde el sentido).','Brazo de delante tapando el pectoral.','Rodilla y gemelo relajados.','Girar demasiado hacia los jueces: se vuelve una pose frontal.']},
 bdb:{name:'Doble bíceps de espaldas',en:'Back double biceps',
   oficial:'De espaldas a los jueces, brazos y muñecas como en el doble bíceps de frente. Un pie atrás apoyado en la punta.',
   tecnica:['Pie de atrás en punta con el gemelo contraído; glúteos e isquios apretados todo el tiempo.','Codos ligeramente por delante del plano del cuerpo: se ven deltoides posteriores y la espalda no se "cierra".','No juntes las escápulas del todo: abre los dorsales y contrae trapecios y erectores.','Cintura succionada aunque nadie te vea la cara; baja un poco la cadera hacia el pie de apoyo.','Practícala con dos espejos o video: es la pose que más músculos evalúa.'],
   jueces:'La pose que más grupos musculares evalúa: cuello, trapecios, teres, infraespinoso, erectores, dorsales, oblicuos, glúteos, isquiotibiales y gemelos. Se usa para medir densidad y definición.',
   errores:['Juntar las escápulas y tapar los dorsales.','Codos muy atrás (desaparece el deltoides posterior).','Glúteo e isquio relajados.','Cadera adelantada: se pierde la curva lumbar y el glúteo.']},
 bls:{name:'Expansión dorsal de espaldas',en:'Back lat spread',
   oficial:'Manos en la cintura con los codos abiertos. Piernas y pies en línea, con hasta 15 cm de separación. Debes mostrar la pantorrilla contraria a la que mostraste en el doble bíceps de espaldas. Prohibido tirar del traje para enseñar el glúteo.',
   tecnica:['Mismo mecanismo que la frontal: codos hacia adelante y afuera, escápulas rotadas, pecho arriba.','Alterna el pie: el talón que levantaste en el doble bíceps de espaldas ahora va plano y levantas el otro.','Glúteos contraídos sin tocar el traje.','Baja un poco los hombros al final para que el trapecio no tape la amplitud.'],
   jueces:'Amplitud y densidad dorsal; después revisión completa de cabeza a pies.',
   errores:['Codos hacia atrás.','Tirar del traje (prohibido).','Olvidar cambiar la pantorrilla.','Encoger los hombros.']},
 str:{name:'Tríceps de lado',en:'Side triceps',
   oficial:'Puedes elegir el lado. Ambos brazos detrás de la espalda, con los dedos entrelazados o la muñeca de delante sujetada por la mano de atrás. La pierna cercana doblada con el pie plano; la lejana doblada con el pie en punta. Presionas con el brazo de delante para contraer el tríceps y además subes el pecho y contraes abdomen, muslos y gemelos.',
   tecnica:['Brazo de delante recto y pegado al cuerpo; empuja contra la mano de atrás para que el tríceps se marque.','Hombro cercano abajo y atrás; gira el tronco un poco (3/4) hacia los jueces para que se vea el pecho.','Exhala y contrae el abdomen; cuádriceps de la pierna de delante tenso.','La pierna lejana en punta muestra el gemelo de perfil.'],
   jueces:'Desarrollo del tríceps primero; luego cabeza a pies con muslo y gemelo de perfil.',
   errores:['Doblar el codo del brazo de delante.','Dejar caer el pecho.','Ponerse totalmente de perfil: se pierde la cintura.','Pierna de delante relajada.']},
 abt:{name:'Abdominales y muslos',en:'Abdominals and thighs',
   oficial:'De frente a los jueces, ambos brazos detrás de la cabeza y una pierna adelante. El tronco hace un ligero "crunch" hacia adelante contrayendo los abdominales, mientras contraes los músculos del muslo adelantado.',
   tecnica:['Exhala todo el aire y contrae el recto abdominal (aquí sí se contrae; no es vacuum).','Codos abiertos para no tapar el pecho; cabeza arriba.','Pierna de delante recta con cuádriceps y gemelo contraídos; la de atrás flexionada apoyada.','Mantén la cintura estrecha: el crunch es ligero, no es doblarse.'],
   jueces:'Abdominales y muslos primero; luego revisión de cabeza a pies.',
   errores:['Inclinarse demasiado hacia adelante.','Cerrar los codos y esconder el pecho.','Pierna adelantada relajada.','Sacar el aire y no mantener la contracción.']},
 vac:{name:'Vacuum',en:'Vacuum pose',
   oficial:'Pies juntos, ambos brazos detrás de la cabeza, de frente a los jueces. Exhalas profundamente y llevas los abdominales hacia adentro (ombligo hacia la columna), mientras flexionas piernas, tronco y brazos. El recto abdominal no se contrae en esta pose.',
   tecnica:['Exhala por completo; luego haz una "inhalación falsa": expande las costillas sin dejar entrar aire y el abdomen se succiona solo.','Mantén 10–15 s respirando muy corto por la nariz sin perder el vacío; en tarima la comparación puede durar más: practica hasta 30 s.','Practica en ayunas al despertar (es cuando más fácil sale) y después de cada entrenamiento; comidas copiosas antes de posar lo arruinan.','Pies juntos de verdad: con pies separados el juez puede pedírtelo de nuevo.','Brazos y piernas tensos: la pose es de cuerpo entero, no solo de cintura.'],
   jueces:'Cintura lo más estrecha posible bajo una caja torácica expandida: control, estética y proporción.',
   errores:['Contraer el recto abdominal (eso es otra pose).','Soltar el vacío antes de que el juez termine la comparación.','Hacerla con pies separados.','Subir los hombros hacia las orejas.']},
 cls:{name:'Pose clásica a elección',en:'Classic pose of athlete\'s choice',
   oficial:'Una sola pose clásica frontal, la que mejor te favorezca. Prohibido el "Most Muscular" (también está excluido de las comparaciones de la ronda 1).',
   tecnica:['Opciones habituales: "Victory" (doble bíceps alto con brazos en V), manos detrás de la cabeza con giro de tronco (3/4 clásico) o pose de pecho 3/4 con una mano en la cadera.','Elige la que muestre tu punto fuerte y ensáyala como si fuera obligatoria: el juez la pide en cada comparación.','La transición desde abdominales y muslos debe ser fluida: es la última de la secuencia.','Dibujo de ejemplo: Victory.'],
   jueces:'Misma rúbrica: proporción, simetría, calidad muscular y presentación; se premia la estética clásica.',
   errores:['Hacer Most Muscular (prohibido).','Hacer una pose de espaldas o de perfil cuando se pide frontal.','Tirar del traje o mostrar la parte interna del muslo (prohibido).']},
 qf:{name:'Frente (cuarto de giro)',en:'Front position',
   oficial:'De pie, erguido y en tensión, cabeza y ojos en la misma dirección que el cuerpo. Una mano en la cadera con los dedos hacia el frente; el otro brazo cuelga al costado ligeramente separado, con la palma abierta. Una pierna un poco hacia el lado; rodillas rectas, core y dorsales ligeramente activados, mentón arriba.',
   tecnica:['Dorsales "abiertos" de forma natural, nunca en expansión de fisicoculturista.','Abdomen firme y cintura estrecha; hombros atrás y abajo.','Peso repartido, rodillas sin bloquear a la fuerza, pies sobre la línea.','Sonrisa y contacto con los jueces: aquí se puntúa presencia y personalidad.'],
   jueces:'Musculatura y condición, proporción vertical (piernas/tronco) y horizontal (cintura/hombros), tono de piel, cabello, presencia escénica y personalidad. Se penaliza lo "demasiado musculoso, duro, seco o magro".',
   errores:['Flexionar como fisicoculturista.','Sacar el pecho exageradamente y arquear la espalda.','Mirar al piso o perder la sonrisa.']},
 qs:{name:'Lado 1 (giro a la derecha)',en:'Quarter turn right',
   oficial:'Giras a la derecha: tu lado izquierdo queda hacia los jueces, con el tronco ligeramente rotado hacia ellos y la cara hacia los jueces. Mano izquierda en la cadera izquierda; brazo derecho cuelga un poco hacia adelante. Pierna cercana ligeramente flexionada con el pie plano; pierna lejana flexionada con el pie atrás sobre la punta.',
   tecnica:['Rota solo el tronco, no la cadera: así se ve la cintura y el hombro.','Pie lejano en punta con el gemelo contraído.','Brazo que cuelga un poco adelante para no tapar el oblicuo.'],
   jueces:'Proporción de perfil, línea de hombros, pecho y cintura; condición general.',
   errores:['Girar de más o de menos (tarjeta amarilla por giros incorrectos; roja baja un puesto).','Flexionar el brazo cercano.']},
 qb:{name:'Espalda (cuarto de giro)',en:'Back position',
   oficial:'De espaldas a los jueces. Los dorsales se muestran de forma natural, sin la contracción máxima que usan los fisicoculturistas. Una mano en la cadera, el otro brazo colgando. Una pierna un poco atrás y hacia el lado, apoyada en la punta. Se evalúa todo el físico.',
   tecnica:['Abre la espalda con las escápulas, sin "sacar" los dorsales a la fuerza.','Glúteos firmes y cintura estrecha; hombros abajo.','Pie de atrás en punta mostrando el gemelo.'],
   jueces:'Amplitud natural de la espalda, cintura, glúteos, gemelos; proporción global.',
   errores:['Lat spread de fisicoculturista (se penaliza).','Mirar por encima del hombro de forma forzada.']},
 qs2:{name:'Lado 2 (giro a la derecha)',en:'Quarter turn right',
   oficial:'Giras de nuevo a la derecha: tu lado derecho queda hacia los jueces. Es el espejo del lado 1: mano derecha en la cadera derecha, brazo izquierdo colgando un poco hacia adelante, pierna cercana plana y lejana en punta.',
   tecnica:['Mismos puntos que el lado 1, en espejo.','Termina con un cuarto de giro más para quedar de frente y repite la posición inicial.'],
   jueces:'Igual que el lado 1.',
   errores:['Olvidar cambiar la mano de la cadera.','Perder la rotación del tronco hacia los jueces.']}
};

function _cItems(arr,color){var h='';for(var j=0;j<arr.length;j++){var t=arr[j];var hi=false;if(typeof t==='string'&&t.charAt(0)==='§'){hi=true;t=t.replace(/§/g,'');}h+='<div class="cat-item'+(hi?' cat-hi':'')+'"><span class="cat-dot"'+(color?' style="color:'+color+'"':'')+'>•</span><span>'+t+'</span></div>';}return h;}
function _foodFull(base,brand){base=String(base||'').trim();brand=String(brand||'').trim();return brand?base+' · '+brand:base;}
function _fimFood(it,on){
  var P=it.P;var f={name:_foodFull(it.base,it.brand)};if(it.brand){f.brand=it.brand;f.base=it.base;}
  f.portionG=P.ref;f.p=_fimR2(it.p);f.c=_fimR2(it.c);f.f=_fimR2(it.f);f.k=it.k>0?_fimR2(it.k):0;f.cat=it.cat||'';f.maxG=0;f.meals=[];
  if(P.mode==='u'){f.byUnit=true;f.unitN=P.unitN||'unidad';f.portionU=P.ref;f.unitG=0;}else{f.unitN=P.unitN||'';f.unitG=P.unitG>0?P.unitG:0;}
  if(P.mode==='ml')f.ml=true;if(on===false)f.off=true;
  if(it.na!==null&&it.na!==undefined&&isFinite(it.na)&&it.na>=0){f.sod=Math.round(it.na*100)/100;f.sodSt=it.naSt||it.srcSt||'pend';if(it.src)f.sodSrc=it.src;f.sodAt=today();}
  return f;}
function _fimLow(s){return String(s||'').trim().toLowerCase();}
function _fimKey(s){return _impStrip(s).replace(/[^a-z0-9%]+/g,' ').trim();}
function catName(c){for(var i=0;i<FOOD_CATS.length;i++)if(FOOD_CATS[i][0]===c)return FOOD_CATS[i][1];return c;}
var CAT_COLOR={prot:'var(--red)',carb:'var(--gold)',grasa:'var(--blue)',fruta:'#c05a80',verdura:'var(--green)',otro:'var(--dim)'};
function _fimSub(f){return _baseTxt(f)+' · P '+_numTxt(+f.p||0)+' · C '+_numTxt(+f.c||0)+' · G '+_numTxt(+f.f||0)+' · '+_numTxt(r1(_kcalOf(f)))+' kcal · '+(naOf(f)!==null?'Na '+naFmt(naOf(f))+' mg':'Na sin dato')+(f.unitG>0&&f.unitN?' · 1 '+f.unitN+' = '+_numTxt(f.unitG)+' '+_mu(f):'');}
function _addLibExFor(muscle,name){
  var c=getExLibCustom();if(!c[muscle])c[muscle]=[];if(c[muscle].indexOf(name)<0)c[muscle].push(name);S.set('exLibCustom',c);
}
function _fimBadTxt(bad){return 'No pude leer '+bad.length+(bad.length===1?' línea':' líneas')+' (no se agrega'+(bad.length===1?'':'n')+'): '+bad.slice(0,4).map(function(b){var n=b.name||b.line;return '«'+escH(n.slice(0,40))+(n.length>40?'…':'')+'»: '+escH(b.why);}).join(' · ')+(bad.length>4?'…':'')+'.';}
function _naMatchIt(it,byKey){if(it.fromLog||_naNum(it.sodg)!==null)return null;var f=byKey[_fgKey(it.name)];if(!f||naOf(f)===null)return null;
  if(it.byUnit){if(!f.byUnit)return null;if(it.imp){var a=_impSingular(_impStrip(it.unitN||'')),b=_impSingular(_impStrip(f.unitN||''));if(!a||a!==b)return null;}return naOf(f)/_portion(f);}
  if(f.byUnit)return null;if(!!it.ml!==!!f.ml)return null;return naOf(f)/_portion(f);}
function naFillPlans(){var by=_naLibKeyMap();var t=today();var n=0;var ps=getPlans();var touched=[];
  Object.keys(ps).forEach(function(d){if(d<t)return;var ch=false;(ps[d].meals||[]).forEach(function(m){m.items.forEach(function(it){var v=_naMatchIt(it,by);if(v===null)return;it.sodg=v;var f=by[_fgKey(it.name)];if(f.sodSt==='est')it.naE=1;n++;ch=true;});});if(ch)touched.push(d);});
  if(n){savePlans(ps);touched.forEach(function(d){try{_syncLogged(getPlan(d));}catch(e){}});try{refreshNutri();}catch(e){}}return n;}
function naFillPlansCount(){var by=_naLibKeyMap();var t=today();var n=0;var ps=getPlans();Object.keys(ps).forEach(function(d){if(d<t)return;(ps[d].meals||[]).forEach(function(m){m.items.forEach(function(it){if(_naMatchIt(it,by)!==null)n++;});});});return n;}
function _renameFoodInPlans(oldN,newN){
  if(!oldN||!newN||oldN===newN)return;var ps=getPlans();var t=today();var touched=[];
  Object.keys(ps).forEach(function(d){if(d<t)return;var p=ps[d];var ch=false;
    (p.meals||[]).forEach(function(m){(m.items||[]).forEach(function(it){if(!it.fromLog&&it.name===oldN){it.name=newN;ch=true;}});});
    if(Array.isArray(p.excluded)&&p.excluded.indexOf(oldN)>=0){p.excluded=p.excluded.map(function(x){return x===oldN?newN:x;});ch=true;}
    if(ch)touched.push(p);});
  try{if(_plan&&_plan!==ps[_plan.date])(_plan.meals||[]).forEach(function(m){(m.items||[]).forEach(function(it){if(!it.fromLog&&it.name===oldN)it.name=newN;});});}catch(e){}
  if(!touched.length)return;savePlans(ps);touched.forEach(function(p){try{_syncLogged(p);}catch(e){}});
}

<script>
/* ── store.js ── */
/* Brunt · almacenamiento.
   IndexedDB propia ("brunt-app"), con copia en memoria para lecturas inmediatas.
   La API S (get/obj/ro/set/del) es la misma de Olympia: así la lógica copiada funciona sin cambios.
   Nunca falla en silencio: si algo no se guarda, se avisa. */
var B = window.B || (window.B = {});
(function () {
  var DB = 'brunt-app', STORE = 'kv', FILES = 'files', LSP = 'brunt:';
  var mem = {}, dirty = {}, db = null, mode = 'idb', timer = null, listeners = [], failed = false, writing = false;

  function clone(v) {
    if (v === undefined || v === null || typeof v !== 'object') return v;
    try { return structuredClone(v); } catch (e) { return JSON.parse(JSON.stringify(v)); }
  }
  function emit(type, info) { listeners.forEach(function (f) { try { f(type, info); } catch (e) {} }); }

  window.S = {
    /* el valor por defecto también se copia: así nadie modifica sin querer una lista de fábrica (p. ej. DEF_SUPPS) */
    get: function (k, d) { return Object.prototype.hasOwnProperty.call(mem, k) ? clone(mem[k]) : clone(d); },
    obj: function (k, d) { return Object.prototype.hasOwnProperty.call(mem, k) ? clone(mem[k]) : clone(d); },
    ro: function (k, d) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : d; },
    has: function (k) { return Object.prototype.hasOwnProperty.call(mem, k); },
    set: function (k, v) {
      if (v === null || v === undefined) { delete mem[k]; } else { mem[k] = clone(v); }
      dirty[k] = 1; schedule(); emit('change', k);
    },
    del: function (k) { delete mem[k]; dirty[k] = 1; schedule(); emit('change', k); },
    keys: function () { return Object.keys(mem); },
    flush: flush,
    on: function (f) { listeners.push(f); },
    mode: function () { return mode; },
    failed: function () { return failed; }
  };

  function schedule() { clearTimeout(timer); emit('pending'); timer = setTimeout(flush, 250); }

  function flush() {
    clearTimeout(timer);
    var keys = Object.keys(dirty);
    if (!keys.length) return Promise.resolve(true);
    dirty = {};
    if (mode === 'ls') {
      try {
        keys.forEach(function (k) {
          if (Object.prototype.hasOwnProperty.call(mem, k)) localStorage.setItem(LSP + k, JSON.stringify(mem[k]));
          else localStorage.removeItem(LSP + k);
        });
        failed = false; emit('saved'); return Promise.resolve(true);
      } catch (e) { failed = true; keys.forEach(function (k) { dirty[k] = 1; }); emit('error', e); return Promise.resolve(false); }
    }
    writing = true;
    return new Promise(function (res) {
      try {
        var tx = db.transaction(STORE, 'readwrite'), st = tx.objectStore(STORE);
        keys.forEach(function (k) {

        under.style.transform = 'translateX(' + (-30 * (1 - r)) + '%)'; shade.style.opacity = String(.35 * (1 - r));
      }, 0);
      view.classList.add('dragging');
    }
    function finish(x, popIt) {
      view.classList.remove('dragging'); view.style.transform = ''; navback.style.opacity = '';
      if (x.under) x.under.remove(); if (x.shade) x.shade.remove();
      if (popIt) B.pop();
    }
  }

  /* barra de «entreno en curso» cuando la sesión está minimizada: puedes navegar mientras entrenas */
  function paintLive() {
    var a = S.ro('activeSession', null);
    if (!a || B.sessionOpen()) { if (live) { live.remove(); live = null; } clearInterval(liveIv); liveIv = null; return; }
    if (!live) {
      live = h('button.live-bar', { type: 'button', onclick: function () { B.openSession(); } }, I('gym'), h('span.t'), h('span.num'));
      document.body.appendChild(live);
    }
    function upd() {
      var x = S.ro('activeSession', null); if (!x || !live) return;
      live.children[1].textContent = 'Entreno en curso · ' + x.routineName;
      var r = x.rest && Math.ceil((x.rest.end - Date.now()) / 1000);
      live.children[2].textContent = r > 0 ? 'Descanso ' + Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') : Math.floor((Date.now() - x.startTime) / 60000) + ' min';
    }
    upd(); clearInterval(liveIv); liveIv = setInterval(upd, 1000);
  }

  function safeAreaFix() {
    /* algunas versiones de iOS reportan 0 abajo en la app instalada: se reserva el espacio del indicador de inicio */
    var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (!standalone) return;
    var p = h('div', { style: { position: 'fixed', bottom: '0', height: '0', paddingBottom: 'env(safe-area-inset-bottom)' } }); document.body.appendChild(p);
    var b = parseFloat(getComputedStyle(p).paddingBottom) || 0; p.remove();
    if (b === 0 && Math.max(screen.height, screen.width) >= 812) document.documentElement.classList.add('pad-b');
  }

  /* si el iPhone no abrió la base de datos, NO se muestra una app vacía (parecería que se perdió todo) ni se ofrece importar */
  function dbTrouble() {
    var app = document.getElementById('app'); app.innerHTML = '';
    app.appendChild(h('main.view', h('div', { style: { padding: '2.4rem .4rem 0' } },
      h('div.t-large', 'No pude abrir tus datos'),
      h('p.dim', { style: { fontSize: '1.02rem', lineHeight: '1.45', margin: '.6rem 0 1.4rem' } }, 'El iPhone no respondió al abrir el almacenamiento de Brunt. Tus datos no se han borrado. Cierra Brunt por completo (desliza hacia arriba en el selector de apps) y ábrela otra vez. Si sigue así, reinicia el iPhone.'),
      h('button.btn.primary.block', { type: 'button', onclick: function () { location.reload(); } }, 'Reintentar'),
      h('p.t-foot.dim', { style: { marginTop: '1.2rem' } }, 'Mientras tanto no captures nada aquí: se guardaría aparte y se vería vacío después.'))));
  }

  function start() {
    if (B.bootError) { dbTrouble(); return; }
    view = h('main.view', { id: 'view' });
    topbar = h('div.topbar', { 'aria-hidden': 'true' });
    navback = h('button.navback.hide', { type: 'button', onclick: function () { B.pop(); } }, I('back'), h('span'));
    tabbar = h('nav.tabbar', { 'aria-label': 'Secciones' }, TABS.map(function (t) {
      return h('button.tab', { type: 'button', onclick: function () { B.go(t[0]); } }, I(t[2]), h('span', t[1]));
    }));
    var app = document.getElementById('app'); app.innerHTML = '';
    app.appendChild(topbar); app.appendChild(navback); app.appendChild(view); app.appendChild(tabbar);
    window.addEventListener('scroll', onScroll, { passive: true });
    safeAreaFix();
    edgeSwipe();
    B.applyMv();
    render();
    if (S.ro('activeSession', null) && S.ro('activeSession', null).rest) B.restoreRest();
    lastDay = today();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && today() !== lastDay) { if (B.nutriDate === lastDay) B.nutriDate = today(); lastDay = today(); B.refresh(); }
    });
    S.on(function (type, k) { if (type === 'change' && k === '*') B.applyMv(); });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  /* el bloqueo opcional va antes de mostrar cualquier dato */
  B.boot().then(function () { return B.lockGate ? B.lockGate() : null; }, function () { return B.lockGate ? B.lockGate() : null; }).then(start, start);
})();

</script>
